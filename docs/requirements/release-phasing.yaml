  # ================================================================ 2.2 General ledger and core accounting
  - section: "2.2.1"
    heading: Chart of accounts management
    mark: release-1
    reason: >-
      The general ledger is "Always active" (S1-2.1.7-c32); Finance maintains the chart in the system
      (S1-2.2.1-c01, Q-005), and statement mapping depends on the accounting framework (Q-003).
    blocking_questions: [Q-003, Q-005, Q-014]
  - section: "2.2.2"
    heading: GL code creation and maintenance
    mark: release-1
    reason: Controlled account creation (S1-2.2.2-c01) is needed before the first account is posted to.
    blocking_questions: [Q-014, Q-027]
  - section: "2.2.3"
    heading: Dimension model
    mark: release-1
    reason: >-
      "Dimensions are carried at line level on every transaction in every module" (S1-2.2.3-c01), so
      they exist before any module posts.
  - section: "2.2.4"
    heading: General ledger data sources and posting controls
    mark: release-1
    reason: '"The general ledger is the single accounting repository" (S1-2.2.4-c01); BO-01.'
  - section: "2.2.5"
    heading: Journals and approval
    mark: release-1
    reason: >-
      "the manual journal is the only other way into the ledger" (S1-1-c16); also the interim route
      for payroll and depreciation until release 2 (decision D-INT-1).
  - section: "2.2.6"
    heading: Correcting an entry — before and after approval
    mark: release-1
    reason: The approval boundary and correction routes (S1-2.2.6-c01) apply to every posting from the first day.
    blocking_questions: [Q-007, Q-013, Q-017]
