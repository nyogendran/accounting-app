subsections:
  # ================================================================ 2.1 Platform, access and security
  - section: "2.1.1"
    heading: Deployment and access
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.1.1-c01, S1-2.1.1-c02, S1-2.1.1-c04, S1-2.1.1-c05]
        reason: >-
          Browser access, three environments, fail-safe behaviour and session timeout are needed by
          every module from the first day (S1-2.1.1-c01, c02, c04, c05); the tenancy model is Q-001.
      - mark: later
        release: 4
        clauses: [S1-2.1.1-c03]
        reason: >-
          Mobile approval, photo capture and dashboard viewing (S1-2.1.1-c03) add convenience but no
          book-keeping step; grouped with the other mobile features.
    blocking_questions: [Q-001]
  - section: "2.1.2"
    heading: User roles and segregation of duties
    mark: release-1
    reason: >-
      Platform service every module needs (S1-2.1.7-c25); "a user cannot approve a document they
      raised" (S1-2.1.2-c16) underpins every posting, and the small-team release (S1-2.1.2-c17) fits
      the first customer's team.
    blocking_questions: [Q-009]
  - section: "2.1.3"
    heading: Security controls
    mark: release-1
    reason: >-
      Single sign-on with MFA, encryption, residency and leaver disabling (S1-2.1.3-c01 to c05) are
      the baseline for holding a tenant's financial data. The identity provider, encryption standard
      and hosting locations are security-owner decisions for the build, not for this phasing.
    blocking_questions: [Q-023, Q-028]
  - section: "2.1.4"
    heading: Audit log
    mark: release-1
    reason: Platform service (S1-2.1.7-c25); the uneditable log (S1-2.1.4-c01) is the basis of BO-02 and BO-03.
    blocking_questions: [Q-020, Q-025]
  - section: "2.1.5"
    heading: Search and enquiry
    mark: release-1
    reason: >-
      Finding any record from any detail on every screen (S1-2.1.5-c01) is daily value to the finance
      team, and search must respect permissions from the start (S1-2.1.5-c13).
    blocking_questions: [Q-024]
  - section: "2.1.6"
    heading: External system integration and connectivity
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.1.6-c01, S1-2.1.6-c02, S1-2.1.6-c04, S1-2.1.6-c06, S1-2.1.6-c08, S1-2.1.6-c11, S1-2.1.6-c12, S1-2.1.6-c14, S1-2.1.6-c15, S1-2.1.6-c16, S1-2.1.6-c17, S1-2.1.6-c27, S1-2.1.6-c28, S1-2.1.6-c29, S1-2.1.6-c30, S1-2.1.6-c31, S1-2.1.6-c32, S1-2.1.6-c33, S1-2.1.6-c34, S1-2.1.6-c35, S1-2.1.6-c36, S1-2.1.6-c37, S1-2.1.6-c38, S1-2.1.6-c39, S1-2.1.6-c40]
