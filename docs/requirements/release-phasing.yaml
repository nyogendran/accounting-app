risks:
  - id: R-01
    risk: >-
      Interim manual journals for payroll and depreciation in release 1 conflict with S1-2-c02 and
      S1-2.8.3-c01 (see D-INT-1); they also leave BO-01's second indicator (S1-2.2.4-c32) unmet until
      release 2.
  - id: R-02
    risk: >-
      Deferring multi-language (most of 2.1.8) to release 3 is safe only if the release 1 design holds
      screen text and terminology as data from the start ("Terminology is held as data",
      S1-2.1.8-c22). That is a tech-lead decision at architecture (L3); otherwise release 3 carries
      rework.
  - id: R-03
    risk: >-
      Deferring group accounting to release 3 is safe only if entity is a mandatory attribute from
      release 1 (S1-2.14.2-c14), which this proposal keeps in release 1, and if the chart of accounts
      is designed as a group chart from the start ("A single group chart of accounts applies across
      all [No.] entities", S1-2.2.1-c18).
  - id: R-04
    risk: >-
      Many release 1 clauses carry bracketed values (workbook v2) and depend on open questions; the
      release 1 build cannot be specified in full until the tax specialist confirms the Sri Lanka tax
      content (Q-003, Q-021) and the qualified accountant decides Q-007 to Q-014.

