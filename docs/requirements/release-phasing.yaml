  # ================================================================ 2.7 Tax reporting and compliance
  - section: "2.7.1"
    heading: Tax register
    mark: release-1
    reason: >-
      Statutory need: "No tax rule is hard-coded in the software" (S1-2.7.1-c01); Sri Lanka taxes are
      configured here before the first invoice.
    blocking_questions: [Q-003, Q-021]
  - section: "2.7.2"
    heading: Entity tax profile
    mark: release-1
    reason: Each entity's taxes, registrations and filing frequencies (S1-2.7.2-c01) are set before it trades.
    blocking_questions: [Q-003]
  - section: "2.7.3"
    heading: Capture at transaction level
    mark: release-1
    reason: >-
      "Tax is computed by the system wherever a transaction gives rise to it" (S1-2.7.3-c01); payroll,
      asset, import and intercompany rows follow rule module-dependent-clauses.
    blocking_questions: [Q-021]
  - section: "2.7.4"
    heading: Return preparation and filing
    mark: release-1
    reason: >-
      Statutory need: returns built from the ledger (S1-2.7-c01; S1-2.7.4-c02).
    blocking_questions: [Q-009, Q-021]
  - section: "2.7.5"
    heading: Returns to be supported
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.7.5-c01, S1-2.7.5-c02, S1-2.7.5-c03, S1-2.7.5-c07]
        reason: >-
          VAT or GST, turnover levy, withholding tax and other duties returns (S1-2.7.5-c01 to c03,
          c07), as far as the tax specialist confirms they apply to the first entity (Q-003, Q-021).
      - mark: later
        release: 2
        clauses: [S1-2.7.5-c04, S1-2.7.5-c05]
        reason: >-
          Employment income tax and statutory fund returns are built from "Payroll runs for the
          period" and "Employee and employer contributions computed in payroll" (SRC-001 p.71,
          S1-2.7.5-c04, c05), delivered in release 2 under options A and C of D-INT-1 (release 1
          under B). Until then the obligations still exist from the first period and are tracked on
          the release-1 tax dashboard (2.7.7), with each schedule "uploaded where prepared outside"
          the system (S1-2.7.7-c20); the tax specialist confirms that this interim is acceptable
          (D-INT-1).
      - mark: needs-decision
        owner: tax-specialist
        clauses: [S1-2.7.5-c06]
        reason: The corporate income tax return (S1-2.7.5-c06) depends on the 2.7.6 decision below.
        recommendation: Release 2, before the first entity's first corporate tax filing after release 1 go-live.
    blocking_questions: [Q-003, Q-021]
  - section: "2.7.6"
    heading: Corporate income tax
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.7.6-c10, S1-2.7.6-c11, S1-2.7.6-c12, S1-2.7.6-c13, S1-2.7.6-c14, S1-2.7.6-c15]
        reason: >-
          The turnover levy, withholding, remittance and penalty entries (S1-2.7.6-c10 to c13) and one
          control account per tax (c15) are needed as soon as the release 1 taxes are filed and paid.
      - mark: needs-decision
        owner: tax-specialist
        clauses: [S1-2.7.6-c01, S1-2.7.6-c02, S1-2.7.6-c03, S1-2.7.6-c04, S1-2.7.6-c05, S1-2.7.6-c06, S1-2.7.6-c07, S1-2.7.6-c08, S1-2.7.6-c09]
        reason: >-
          Whether the corporate tax computation, capital allowances, losses, deferred tax and
          instalments (S1-2.7.6-c01 to c09) must be in the system for the first entity's first filing,
          or may be prepared outside it for that year, is a tax decision; the capital allowance
          register "runs alongside the fixed asset register" (S1-2.7.6-c02), which is in release 2
          under option A of D-INT-1 and in release 1 under B and C. Deferring these clauses leaves two
          postings without a release-1 route: "Current tax charge for the period Dr Income tax expense
          · Cr Income tax payable" (S1-2.7.6-c07) and "Instalment or payment on account Dr Income tax
          payable · Cr Bank" (SRC-001 p.71, S1-2.7.6-c08). Income tax payable is a tax control
          account (S1-2.2.1-c06; "A separate control account is held per tax and per entity",
          S1-2.7.6-c15), so a manual journal to it is blocked (S1-2.2.1-c21). The release-1 row
          "Remittance of any tax to the authority Dr the relevant tax payable account · Cr Bank"
          (S1-2.7.6-c12) may already cover the payment of an instalment; whether it does is for the
          tax specialist with the qualified accountant. The interim for these postings is part of
          D-INT-1.
        recommendation: >-
          Release 2 with the fixed asset core under option A, or release 1 under options B and C if
          the tax specialist requires the computation in the system for the first filing. The interim
          route for the charge and instalments follows D-INT-1; no journal route is proposed here.
    blocking_questions: [Q-003, Q-021]
  - section: "2.7.7"
    heading: Tax compliance dashboard and calendar
    mark: release-1
    reason: >-
      Statutory need: "No obligation in any jurisdiction is tracked outside the system."
      (S1-2.7.7-c01). Obligations whose return is not yet built in the system, such as employment
      income tax, statutory fund contributions and corporate income tax instalments (SRC-001's
      illustrative rows "EPF — employee and employer", "ETF", "Payroll income tax" and "Corporate
      income tax — instalment", p.72), are still tracked here from release 1, with the schedule
      "uploaded where prepared outside" the system (S1-2.7.7-c20). Which obligations apply to the
      first entity is for the tax specialist (Q-003, Q-021).
    blocking_questions: [Q-003, Q-021]
  - section: "2.7.8"
    heading: Tax reconciliation and audit
    mark: release-1
    reason: Every tax figure "is proved against the return that declared it" (S1-2.7.8-c01); BO-04.
  - section: "2.7.9"
    heading: Tax reports
    mark: release-1
    reason: Tax reports per entity, jurisdiction and tax (S1-2.7.9-c07); rule reports-and-dashboards.
  - section: "2.7.10"
    heading: Group tax view
    mark: later
    release: 3
    reason: The dashboard "viewed across all entities" (S1-2.7.10-c01) needs a second entity.
  - section: "2.7.11"
    heading: Acceptance tests
    mark: release-1
    reason: >-
      Tests of release 1 tax behaviour; S1-2.7.11-c01 uses two entities, which release 1 holds in a
      test environment (A-03); c13 and c14 follow rule module-dependent-clauses.
    blocking_questions: [Q-003, Q-021]
  # ================================================================ 2.8 Fixed assets
  - section: "2.8.1"
    heading: Asset register
    mark: later
    release: 2
    reason: >-
      Marked as under option A of D-INT-1; release 1 under options B and C (see variants).
      Depreciation "must be auto-calculated by the system, not by a spreadsheet" (S1-2.8.3-c01), and
      fixed asset control accounts accept "sub-ledger postings only" (S1-2.2.1-c06). SRC-001 gives
      depreciation no interim route; how depreciation, capital purchases (S1-2.8.13-c01) and other
      asset events reach the ledger before this module exists is decision D-INT-1.
