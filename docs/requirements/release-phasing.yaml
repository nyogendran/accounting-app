risks:
  - id: R-01
    risk: >-
      Any interim route for payroll, fixed asset and income tax postings (D-INT-1, option A) meets the
      release-1 control-account block (S1-2.2.1-c06, c21) and the rule that a control flag cannot
      change once transactions exist (S1-2.2.2-c16; see also c12): either a release-1 control is
      relaxed, or interim non-control accounts are used and their balances moved into new control
      accounts at release 2, through the sub-ledger or by an approved reclassification, depending on
      how the qualified accountant reads S1-2.2.1-c21 against S1-2.2.2-c16 and c18 (D-INT-1,
      option A). Separately, BO-01's second indicator
      (S1-2.2.4-c32) names "a payslip, a depreciation run and a stock issue": under option A the
      payslip and depreciation parts are unmet until release 2, and the stock-issue part is unmet
      until inventory in release 5, and can never be met by a service-only entity that does not
      activate inventory (S1-2.1.7-c77).
  - id: R-02
    risk: >-
      Deferring multi-language (most of 2.1.8) to release 3 is safe only if the release 1 data model
      holds terminology as data, non-Latin scripts and one code with many descriptions from the start
      (S1-2.1.8-c20, c22, c34, c42, c43). This version marks those clauses release-1 design
      constraints; the tech lead confirms the design at architecture (L3), with the product owner.
  - id: R-03
    risk: >-
      Deferring group accounting to release 3 is safe only if entity is a mandatory attribute from
      release 1 (S1-2.14.2-c14), which this proposal keeps in release 1, and if the chart of accounts
      is designed as a group chart from the start ("A single group chart of accounts applies across
      all [No.] entities", S1-2.2.1-c18).
  - id: R-04
    risk: >-
      Many release 1 clauses carry bracketed values (workbook v3) and depend on open questions; the
      release 1 build cannot be specified in full until the tax specialist confirms the Sri Lanka tax
      content (Q-003, Q-021) and the qualified accountant decides Q-007 to Q-014.
  - id: R-05
    risk: >-
      The tenant boundary is not settled. SRC-001 uses "entity" for each legal entity of a group that
      shares "One platform · one data set · one chart of accounts · one audit trail" (SRC-001 p.13,
      S1-2.1.7-c02) and consolidates (S1-2.14-c01), so mapping one legal entity to one tenant would
      split a group across tenants. Q-001 says TIQACC is multi-tenant but maps nothing to a tenant.
      Until the product owner, tech lead and security owner settle it (OI-TENANT, question record
      Q-031), the release-1 data
      model and the isolation controls of 2.1.3 and 2.14.2 cannot be specified in full.
  - id: R-06
    risk: >-
      An entity that runs on release 1 and then activates payroll or fixed assets needs their opening
      data loaded (S1-2.16.2-c01), against the promise that a further module is activated "without
      data migration" (S1-2.1.7-c08) and against the acceptance part "activating a second module
      later leaves the first unchanged and requires no migration" (S1-2.1.7-c84, p.17; decision
      D-2.1.7-c84). The size of this load depends on D-INT-1 (none for an entity that starts on
      option B; fixed assets none and payroll from the external system under C; both under A, and
      under A(ii) reading R1 also the interim payroll and fixed asset balances). It also completes
      the employee fields deferred from release 1 (2.10.1, D-2.10.1). See releases, loading_task.

variants:
  basis: >-
    The marks under subsections are the marks under option A of D-INT-1. The lists below give every
    change under option B and under option C. Nothing else changes. No option is recommended.
  B:
    name: Payroll and fixed assets in release 1
    section_intros_to_release_1: ["2.8", "2.10"]
    subsections_to_release_1: ["2.8.1", "2.8.2", "2.8.3", "2.8.4", "2.8.5", "2.8.6", "2.8.7", "2.8.13", "2.8.14", "2.8.15", "2.10.2", "2.10.3", "2.10.4", "2.10.5", "2.10.6", "2.10.7", "2.10.8", "2.10.9", "2.10.10", "2.10.11", "2.10.12", "2.10.14", "2.10.15"]
    parts_to_release_1:
      - {section: "2.7.5", clauses: [S1-2.7.5-c04, S1-2.7.5-c05]}
      - {section: "2.8.16", clauses: [S1-2.8.16-c01, S1-2.8.16-c02, S1-2.8.16-c03, S1-2.8.16-c04, S1-2.8.16-c05, S1-2.8.16-c06, S1-2.8.16-c07, S1-2.8.16-c08, S1-2.8.16-c11, S1-2.8.16-c12]}
      - {section: "2.10.1", clauses: [S1-2.10.1-c03, S1-2.10.1-c04, S1-2.10.1-c05, S1-2.10.1-c06, S1-2.10.1-c08, S1-2.10.1-c10, S1-2.10.1-c11, S1-2.10.1-c12, S1-2.10.1-c13]}
      - {section: "2.9.1", from_release: 2, clauses: [S1-2.9.1-c08]}
    recommendations_that_change:
      - '2.8.8 and S1-2.8.16-c09: release 1 if the first entity has leases (D-2.8.8).'
      - '2.7.6 needs-decision part: release 1 becomes possible because the fixed asset register is in release 1 (S1-2.7.6-c02); still D-2.7.6.'
      - >-
        2.1.6, workbook value 19 ("[attendance device, where used]", S1-2.1.6-c17): the release-1
        part of 2.1.6 leaves it out "because attendance belongs to payroll" (S1-2.10.4-c01), and
        under option B payroll and attendance (2.10.4) are in release 1, so that reason no longer
        holds. Whether an attendance device integration is live at go-live is then open for the
        product owner under value 19; SRC-001 says "where used", and whether the first entity uses
        one is not recorded. This file proposes neither.
    unchanged: The payroll assistant (2.10.13) stays in release 4; physical verification, capital budgeting, maintenance and multi-entity assets (2.8.9 to 2.8.12) keep their releases.
    release_2_then_holds: >-
      Supplier invoice capture (2.5.3, S1-2.11.2-c02, c04, S1-2.5.18-c04), the report builder and
      self-service (2.13.2, 2.13.4, S1-2.13.7-c01, c04), and corporate income tax if D-2.7.6 places
      it there.
    counts:
      by_top_level_mark: {release-1: 112, later: 51, needs-decision: 4, split: 20}
      later_by_release: {"2": 3, "3": 13, "4": 20, "5": 15}
      note: A split whose parts all move to release 1 (2.10.1) is still counted as split.
  C:
    name: Payroll by interface from the payroll system in use; fixed asset core in release 1
    section_intros_to_release_1: ["2.8"]
    subsections_to_release_1: ["2.8.1", "2.8.2", "2.8.3", "2.8.4", "2.8.5", "2.8.6", "2.8.7", "2.8.13", "2.8.14", "2.8.15"]
    parts_to_release_1:
      - {section: "2.8.16", clauses: [S1-2.8.16-c01, S1-2.8.16-c02, S1-2.8.16-c03, S1-2.8.16-c04, S1-2.8.16-c05, S1-2.8.16-c06, S1-2.8.16-c07, S1-2.8.16-c08, S1-2.8.16-c11, S1-2.8.16-c12]}
      - {section: "2.1.6", from_release: 5, clauses: [S1-2.1.6-c09]}
      - {section: "2.9.1", from_release: 2, clauses: [S1-2.9.1-c08]}
    reason_for_the_set: >-
      The review names the fixed asset core as 2.8.1 to 2.8.5 and 2.8.13. This variant adds 2.8.6 and
      2.8.7 because disposal, write-off, revaluation and impairment post to the same asset cost,
      accumulated depreciation and accumulated impairment accounts (S1-2.8.13-c07 to c12), which
      would otherwise need the interim route that option C avoids; transfers to another entity in
      2.8.6 still follow 2.14 by rule module-dependent-clauses. 2.8.14 and 2.8.15 are the reports
      and governance of the core. S1-2.1.6-c09 is the integration row that names "Payroll and
      workforce management" (p.11); its other systems are used only when their tenants need them.
      S1-2.9.1-c08 (fixed asset item) moves with S1-2.8.2-c02, as under option B (see 2.9.1).
    recommendations_that_change:
      - '2.8.8 and S1-2.8.16-c09: release 1 if the first entity has leases (D-2.8.8).'
      - '2.7.6 needs-decision part: release 1 becomes possible because the fixed asset register is in release 1 (S1-2.7.6-c02); still D-2.7.6.'
    unchanged: >-
      Payroll (2.10, including the release-2 part of 2.10.1) and the payroll returns
      (S1-2.7.5-c04, c05) stay in release 2.
    counts:
      by_top_level_mark: {release-1: 99, later: 64, needs-decision: 4, split: 20}
      later_by_release: {"2": 16, "3": 13, "4": 20, "5": 15}

