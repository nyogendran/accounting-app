  # ================================================================ 2.16 Non-functional, migration and acceptance
  - section: "2.16.1"
    heading: Performance and availability
    mark: release-1
    reason: >-
      Response, availability, backup and recovery targets (S1-2.16.1-c01 to c04) apply from the first
      day of production use; values are workbook entries. Serves BO-08.
    blocking_questions: [Q-005, Q-024]
  - section: "2.16.2"
    heading: Data migration
    mark: needs-decision
    owner: product-owner
    with: qualified-accountant
    reason: >-
      Whether any data is taken over from a current system is unknown (Q-006). An entity that has
      balances at go-live cannot open them by manual journal: opening receivables, payables, bank and
      tax balances would be manual journals to control accounts, which are blocked
      (S1-2.2.1-c06, c21); and receivables requires that "no balance in it exists without a document
      behind it" (SRC-001 p.36, S1-2.3-c01). SRC-001's migration scope loads "chart of accounts,
      opening trial balance, open receivables and payables by invoice" (p.120, S1-2.16.2-c01). The
      same clause names the "fixed asset register with accumulated depreciation" and the "employee
      master with year-to-date payroll figures", which are loaded when those modules are activated
      (releases loading_task, risk R-06), and stock by item, which comes with inventory (release 5).
    recommendation: >-
      Release 1 for any entity with balances at go-live: the chart of accounts, the opening trial
      balance and open receivables and payables by invoice (part of S1-2.16.2-c01), with
      reconciliation and sign-off of each load, original numbers and a dry run (S1-2.16.2-c02 to
      c04). Fixed asset and payroll data follow their modules; "[n] years of transaction history"
      (S1-2.16.2-c01, workbook value 178) follows Q-006. The opening-balance method, including how
      fixed asset and payroll balances open before their modules exist, is for the qualified
      accountant and is linked to D-INT-1. An entity with no balances at go-live needs none of this
      in release 1.
    blocking_questions: [Q-005, Q-006, Q-029]
  - section: "2.16.3"
    heading: Documentation and handover
    mark: needs-decision
    owner: product-owner
    reason: >-
      The deliverables (S1-2.16.3-c01 to c04) are addressed to a vendor; how they apply to Tiqri's own
      product is Q-023.
    recommendation: Release 1 for the user manual and training of the modules in release 1 (S1-2.16.3-c02, c04).
    blocking_questions: [Q-023]
  - section: "2.16.4"
    heading: Acceptance protocol
    mark: release-1
    reason: >-
      "Each module is accepted separately" (S1-2.16.4-c01), which makes phasing possible; final
      acceptance needs "one full accounting cycle run in parallel" (S1-2.16.4-c04), which needs a
      current system to compare with (Q-006).
    blocking_questions: [Q-001, Q-006, Q-024]

decisions_needed:
  - id: D-INT-1
    question_record: Q-029 (version 2)
    owner: product-owner
    with: [qualified-accountant, tax-specialist]
    chosen: none
    question: >-
      Until payroll and fixed assets are delivered, how do their postings, and the postings and
      returns that depend on them, reach the ledger and the tax authority?
    scope:
      - >-
        Payroll: "Salary and employer-contribution expense by department, net pay payable and
        statutory payroll liabilities" (SRC-001 p.4, S1-0-c10); entries S1-2.10.10-c01 to c08.
      - >-
        Fixed asset events: acquisition from a supplier invoice, capitalisation, depreciation,
        revaluation, impairment, disposal and write-off (S1-2.8.13-c01 to c12).
      - Leases, if the first entity has them (D-2.8.8; S1-2.8.13-c13 to c15).
      - >-
        Employment income tax and statutory fund contribution returns, built from payroll
        (S1-2.7.5-c04, c05). In release 1 they are still obligations on the tax dashboard
        (S1-2.7.7-c01), with the schedule "uploaded where prepared outside" the system
        (S1-2.7.7-c20). The tax specialist confirms this for the interim.
      - >-
        Corporate income tax charge and instalments (S1-2.7.6-c07, c08), which post to income tax
        payable, a tax control account, if D-2.7.6 keeps 2.7.6 out of release 1. Whether the
        release-1 remittance row S1-2.7.6-c12 covers the instalment payment is for the tax specialist
        with the qualified accountant.
      - >-
        Opening fixed asset and payroll balances of an entity that has balances at go-live
        (D-2.16.2).
    against_interim_journals:
      - '"No user journal is acceptable as a substitute" (SRC-001 p.8, S1-2-c02).'
      - '"Payroll processing" is a row of "What the system posts, without a manual journal" (p.4, S1-0-c10).'
      - >-
        Depreciation is "posted by the system, and never maintained in a spreadsheet alongside it"
        (p.75, S1-2.8-c01) and "must be auto-calculated by the system, not by a spreadsheet" (p.77,
        S1-2.8.3-c01).
      - >-
        "Receivables, payables, inventory, payroll, fixed asset, tax and bank control accounts accept
        sub-ledger postings only; manual journals to them are blocked" (p.23, S1-2.2.1-c06) and
        "Posting is blocked to: ... control accounts by manual journal" (p.24, S1-2.2.1-c21). Both
        are release-1 clauses. An interim payroll journal credits net pay, withholding and fund
        payables, which 2.12.1 agrees to payroll as control accounts ("Net pay, withholding tax and
        fund contribution payables", p.101, S1-2.12.1-c06). An interim depreciation journal credits
        accumulated depreciation ("Fixed asset cost and accumulated depreciation", S1-2.12.1-c05).
      - >-
        "Control account flag Yes Once set, cannot be changed while the account carries a balance"
        (p.24, S1-2.2.2-c12); "Class, group and control-account status cannot be changed once
        transactions exist" (p.24, S1-2.2.2-c16). Leaving these accounts unflagged in release 1
        cannot be corrected quietly later: by c16 an account that has had transactions can never be
        flagged, even at a nil balance, which c12 alone would allow.
    on_moving_balances_later:
      - >-
        "A misclassified account is corrected by opening the correct account and reclassifying the
        balance by journal, with the working attached" (SRC-001 p.24, S1-2.2.2-c16).
      - >-
        "A controlled reclassification tool can move history from one account to another, restricted
        to [role], requiring approval, posting a visible journal rather than rewriting history, and
        recorded in the audit log" (SRC-001 p.25, S1-2.2.2-c18).
      - >-
        "Posting is blocked to: ... control accounts by manual journal" (SRC-001 p.24,
        S1-2.2.1-c21). SRC-001 does not say whether the journal of c16, or the journal the c18 tool
        posts, is a "manual journal" under c21 when the correct account is a control account. Both
        readings are set out under option A; this file chooses neither.
    for_interim_journals:
      - >-
        "adjustments can also be made by manual journal posting where required, under approval and
        with the supporting working attached" (SRC-001 p.4, S1-0-c02).
      - >-
        "Any calculation behind a posted figure — accruals, provisions, allocations, depreciation,
        expected credit loss, gratuity — is attached to the journal that posts it" (p.100,
        S1-2.11.5-c01).
    for_a_module_not_yet_active:
      - >-
        "A module switched off is absent ... and none of its postings arise" (SRC-001 p.13,
        S1-2.1.7-c09), and "where it is not activated, the external system takes its place and feeds
        TIQACC through this interface" (p.11, S1-2.1.6-c14). This supports option C for payroll,
        subject to Q-022. SRC-001 gives depreciation no comparable route.
    options:
      - option: A
        name: Interim manual journals; payroll and fixed assets in release 2
        description: >-
          The postings in scope reach the ledger by approved manual journal with the working attached
          until release 2. The marks under subsections are the marks under this option.
        effect_on_release_1: >-
          The smallest release 1: 89 sub-sections release-1 by top-level mark, plus the release-1 parts
          of 18 of the 20 splits (2.8.16 and 2.15.11 have no release-1 part). Payroll and the fixed
          asset core are in release 2.
        effect_on_control_account_rule: >-
          Option A cannot be applied without one of two consequences, and the qualified accountant
          says which: (i) relax the release-1 block of S1-2.2.1-c06 and c21 for the payroll, fixed
          asset and income tax accounts until release 2, which changes a release-1 requirement of
          SRC-001 and so needs a change request. SRC-001's own rule applies "after signature" ("Any
          change to a clause in Section 2 after signature is handled as a documented change
          request", S1-3-c01, p.121), and SRC-001 is unsigned until Q-004 is decided, so the change
          is also made under the framework's change control (SRC-005, A3; change requests under
          C4). Or (ii) post to interim accounts that are not flagged as control accounts. Under (ii)
          the interim accounts can never be flagged later, because "control-account status cannot
          be changed once transactions exist" (S1-2.2.2-c16, p.24), so at release 2 new control
          accounts are opened and the balances moved into them. How they move depends on a tension
          inside SRC-001, and the qualified accountant chooses between two readings (see
          on_moving_balances_later). Reading R1: the block on "control accounts by manual journal"
          (S1-2.2.1-c21, p.24) governs, so neither the reclassification journal of S1-2.2.2-c16 nor
          a journal posted by the tool of S1-2.2.2-c18 may post to the new control accounts, and the
          balances must arrive through the sub-ledger, for example by the release-2 loading task.
          Reading R2: S1-2.2.2-c16 is the specific rule for correcting a misclassified account
          ("opening the correct account and reclassifying the balance by journal", p.24), and the
          controlled reclassification tool posts "a visible journal", under approval and in the
          audit log (S1-2.2.2-c18, p.25), which may not be a "manual journal" under c21; the
          balances then move by one approved reclassification. Under R1, A(ii) needs a sub-ledger
          load at release 2; under R2 it closes with an approved reclassification. Under (i) and
          (ii) alike, the sub-ledger agreements for these accounts (S1-2.12.1-c05, c06) do not run
          in release 1.
        other_effects: >-
          S1-2-c02, S1-0-c10 and S1-2.8-c01 are not met for payroll and fixed assets until release 2.
          BO-01's second indicator stays unmet for payslips and depreciation runs until release 2
          (see R-01).
        depends_on:
          - qualified-accountant choice of (i) or (ii)
          - under (ii), qualified-accountant choice of reading R1 or R2 of S1-2.2.1-c21 against S1-2.2.2-c16 and c18
          - under (i), a change request, since SRC-001 is unsigned (Q-004; S1-3-c01)
          - tax-specialist confirmation of the interim for payroll returns
      - option: B
        name: Payroll and fixed assets in release 1
        description: >-
          The payroll module (2.10 except its assistant) and the fixed asset core move into release 1;
          no interim route is needed for them.
        effect_on_release_1: >-
          23 more sub-sections move into release 1, with the release-2 parts of 2.7.5, 2.8.16 and
          2.10.1 and the 2.8 and 2.10 introductions (variants.B). The assurance review estimates that
          this roughly doubles release 1 (REV-01M5EP1W4DYPM707EB79AYEYV1, finding 3); this file
          counts sub-sections and does not estimate effort. Release 1 then needs the Sri Lanka payroll
          rule set, which is configuration with statutory content from the tax specialist
          (S1-2.10.2-c01; Q-003).
        effect_on_control_account_rule: >-
          None. Every control account named in S1-2.2.1-c06 receives sub-ledger postings from release
          1, except inventory, which is absent for a service entity (S1-2.1.7-c77, A-01).
        other_effects: >-
          The release-2 loading task is not needed for an entity that starts on option B. The
          corporate income tax interim still follows D-2.7.6.
        depends_on: [tax-specialist content for the Sri Lanka payroll rule set]
      - option: C
        name: Payroll by interface from the payroll system in use; fixed asset core in release 1
        description: >-
          Payroll results come from the payroll system the first entity uses today, through the
          integration interface (S1-2.1.6-c14), until the payroll module is delivered in release 2.
          The fixed asset core moves into release 1.
        effect_on_release_1: >-
          10 more sub-sections move into release 1, with the release-2 part of 2.8.16, the 2.8
          introduction and the payroll row of the integration table (S1-2.1.6-c09) (variants.C). The
          payroll module stays in release 2.
        effect_on_control_account_rule: >-
          None for fixed assets. For payroll, the control accounts receive postings from the
          interface; SRC-001 says a received transaction "updates the relevant module as though it had
          been entered in it ... and raises its ledger entries through the posting rules in 2.6.10"
          (p.11, S1-2.1.6-c15). Whether such postings count as sub-ledger postings under S1-2.2.1-c06
          while the payroll module is not active is for the qualified accountant. Two further effects
          follow. (a) The payroll row of the sub-ledger agreement, "Net pay, withholding tax and fund
          contribution payables | Payroll run totals not yet remitted" (p.101, S1-2.12.1-c06), has no
          payroll run totals in TIQACC to agree to in release 1, because no payroll run is made in
          TIQACC until release 2. (b) The entries the interface raises are configured on the interface
          ("field mapping, value translation, posting rules, schedule and error handling are all set up
          without development", p.11, S1-2.1.6-c16). Whether the payroll entry table of 2.10.10
          (S1-2.10.10-c01 to c08) governs those interface posting rules before 2.10.10 is delivered is
          an open point for the qualified accountant; SRC-001 does not say.
        other_effects: >-
          The payroll returns are prepared in the external payroll system and their schedules
          uploaded (S1-2.7.7-c20) until release 2. At release 2 the employee master with year-to-date
          payroll figures is loaded from the external system (release-2 loading task).
        depends_on:
          - Q-022 read as (A) or (C), since "A third-party payroll product synchronising by file transfer is not acceptable" (S1-2.10-c01)
          - a payroll system in use today, which is not recorded (Q-006)
          - qualified-accountant confirmation on interface postings to payroll control accounts
          - qualified-accountant view on how the payroll control accounts are agreed in release 1 without payroll run totals (S1-2.12.1-c06)
          - qualified-accountant view on whether S1-2.10.10-c01 to c08 govern the interface posting rules (S1-2.1.6-c16) before 2.10.10 is delivered
          - tax-specialist confirmation of payroll returns prepared outside the system for the interim
    assurance_view: >-
      REV-01M5EP1W4DYPM707EB79AYEYV1 (E4, advisory) recommends considering option C. Recorded here as
      the reviewer's view; this file recommends no option.
  - id: D-2.10.1
    owner: product-owner
    question: >-
      Is a minimal employee record (S1-2.10.1-c01, c02, c07, c09) in release 1 so that expense claims
      (S1-2.5.2-c07) can be raised and settled by payment, or are expense claims deferred with the
      rest of 2.10.1, and if so how are employee expenses handled meanwhile? If the minimal record is
      in release 1: (a) SRC-001 says a claim is "approved by the manager" (p.49, S1-2.5.2-c07) and
      holds the reporting line in the employee master ("the hierarchy is maintained in the employee
      master rather than assumed from the department", p.96, S1-2.10.11-c08), although the field
      table (p.91) has no manager field; is that reporting line held in the release-1 record, so
      that the approver of a claim comes from it? (b) SRC-001's employee route for raising a claim is
      self-service (S1-2.10.11-c04, p.96), proposed for release 2; is a claim raised in release 1 by
      the employee as a named user ("Named-user licensing", S1-2.1.3-c05, p.10), or keyed by Finance
      on the employee's behalf? The choice affects licensing and segregation of duties ("a user
      cannot approve a document they raised", S1-2.1.2-c16, p.9). (c) Is it accepted that the
      deferred mandatory fields (S1-2.10.1-c03 to c06, c08, c10, c11) are validated only from
      payroll activation, as the 2.10.1 split proposes?
  - id: D-2.1.5-c17
    owner: product-owner
    question: How is the two-year-old-invoice search test (S1-2.1.5-c17) run at release-1 acceptance if no history is migrated? (Q-006)
  - id: D-2.1.7-c84
    owner: product-owner
    question: >-
      May the module-activation acceptance test S1-2.1.7-c84 be accepted in part in release 1, in
      part in release 2, and in full in release 5? Its part "activating a second module later leaves
      the first unchanged and requires no migration" (SRC-001 p.17) is exercised when payroll or
      fixed assets are activated in release 2 (options A and C of D-INT-1), and the release-2 loading
      task (R-06) stands against "requires no migration": how is that part met or accepted?
  - id: D-2.3.3
    owner: product-owner
    question: Which billing types (milestone, progress, subscription, project) does the first customer use? (S1-2.3.3-c05 to c08)
  - id: D-2.3.4
    owner: qualified-accountant
    question: Which revenue recognition bases do the first customer's contracts require? (S1-2.3.4-c04 to c06)
  - id: D-2.7.6
    owner: tax-specialist
    with: qualified-accountant
    question: >-
      Must corporate income tax be computed in the system for the first entity's first filing?
      (S1-2.7.5-c06, S1-2.7.6-c01 to c09). If not, the charge and instalments (S1-2.7.6-c07, c08)
      fall under D-INT-1.
  - id: D-2.8.8
    owner: qualified-accountant
    question: Does the first entity have leases that give rise to right-of-use assets, and on what basis? (S1-2.8.8-c01)
  - id: D-2.15.8
    owner: product-owner
    question: >-
      Is the governance panel in release 1? (S1-2.15.8-c01, S1-2.15.11-c03, c04). Under the current
      marks BO-05's indicators S1-2.13.7-c01, S1-2.15.11-c01 and c08 cannot be met in release 1, and
      S1-2.15.11-c03 can be met only if the panel is in release 1 (see BO-05 v2).
  - id: D-2.16.2
    owner: product-owner
    with: qualified-accountant
    question: >-
      Is data migrated, and if so what? (Q-006; S1-2.16.2-c01 to c04). Does the first entity have
      balances at go-live, and by what method are they opened, given that manual journals to control
      accounts are blocked (S1-2.2.1-c21)?
  - id: D-2.16.3
    owner: product-owner
    question: How do the documentation and handover deliverables apply to Tiqri's own product? (Q-023; S1-2.16.3-c01 to c04)
  - id: D-2.1.7-c83
    owner: product-owner
    question: How is the vendor statement in S1-2.1.7-c83 handled? (Q-023)

