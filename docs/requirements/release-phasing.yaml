  # ================================================================ 2.5 Accounts payable
  - section: "2.5.1"
    heading: Supplier master and hierarchy
    mark: release-1
    reason: >-
      Payables is core (S1-2.1.7-c35); a supplier cannot be "transacted on or paid until it is
      authorised" (S1-2.5.1-c18).
  - section: "2.5.2"
    heading: Invoice types and controls
    mark: release-1
    reason: >-
      Supplier invoices keyed or imported with the original attached (S1-2.5.2-c10); the email and
      optical routes named there follow 2.5.3 in release 2. An "Expense claim Raised by an employee
      with receipts attached, approved by the manager, settled through payroll or by payment"
      (SRC-001 p.49, S1-2.5.2-c07) arises whether payroll is active or not, and posts "Cr Employee
      payable" (p.55, S1-2.5.13-c13). It needs an employee record, which is why part of the employee
      master (2.10.1) is proposed for release 1. Until payroll is delivered a claim is settled by
      payment. The field table of the employee master (S1-2.10.1, p.91) has no manager field, but
      SRC-001 puts the reporting line in the employee master: "A manager sees only their own
      reporting line, and the hierarchy is maintained in the employee master rather than assumed
      from the department" (SRC-001 p.96, S1-2.10.11-c08). That clause is in 2.10.11, release 2, and
      is not in the release-1 part of 2.10.1. SRC-001's route for an employee to raise a claim is
      self-service, "Claim and reimbursement submission with attachment" (p.96, S1-2.10.11-c04),
      also release 2. Whether the reporting line is held in release 1, and how a claim is raised
      in release 1, are part of decision D-2.10.1.
