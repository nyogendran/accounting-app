    heading: Revaluation and impairment
    mark: later
    release: 2
    reason: Delivered with the register so that carrying amounts can be adjusted under approval (S1-2.8.7-c07).
  - section: "2.8.8"
    heading: Lease accounting — right-of-use assets
    mark: needs-decision
    owner: qualified-accountant
    reason: >-
      Whether the first entity holds leases that give rise to a right-of-use asset (S1-2.8.8-c01), and
      the accounting basis, is an accounting decision; SRC-001 does not name the framework (Q-003).
    recommendation: >-
      If the first entity has such leases, the same release as the fixed asset core (release 2 under
      option A of D-INT-1, release 1 under B and C); otherwise release 5. Under option A the
      right-of-use asset, a fixed asset category (S1-2.8.1-c17), and the lease liability have the
      same interim gap as other fixed asset postings (S1-2.8.13-c13 to c15); whether the lease
      liability is a control account SRC-001 does not say, which is for the qualified accountant.
    blocking_questions: [Q-003]
  - section: "2.8.9"
    heading: Maintenance
    mark: later
    release: 5
    reason: Preventive maintenance and warranty tracking (S1-2.8.9-c01, c02) are operations rather than book-keeping.
