purpose: >-
  A proposal, for the product owner to decide, of the order in which SRC-001 section 2 is built.
  "Every module in this document is to be built" (SRC-001 p.6, S1-1-c08); this file proposes only
  the order. It recommends; it decides nothing. Every reason cites clauses. Where an accounting, tax
  or scope fact needed for a mark is not settled by SRC-001 or a question record, the mark is
  needs-decision with the owner role.
how_to_read_options: >-
  The boundary between release 1 and release 2 depends on decision D-INT-1 (Q-029 v2), which has
  three options, A, B and C, and this file chooses none of them. The marks under subsections are
  written out in full once, as they stand under option A, only because A changes the fewest marks
  from version 1; that is a convention of presentation, not a recommendation. The variants block
  lists every sub-section whose mark changes under option B and under option C, so that each option
  is one complete, coherent proposal. The effect of each option on release 1 and on the
  control-account rule (S1-2.2.1-c06, S1-2.2.1-c21, S1-2.2.2-c12, S1-2.2.2-c16, S1-2.2.2-c18) is
  under decisions_needed, D-INT-1.

legend:
  release-1: In the first release, for Tiqri's internal finance team (Q-001) in Sri Lanka (Q-003).
  later: In a later release; release gives the proposed release number (2 to 5, defined under releases).
  needs-decision: The mark depends on a decision recorded under owner; recommendation gives the proposal.
  split: The sub-section splits; parts assigns every one of its clauses, by clause ID, to a mark.

rules:
  - key: module-dependent-clauses
    rule: >-
      A clause inside a release-1 sub-section that concerns a transaction, posting, report row or
      reconciliation that exists only when another module is active (inventory 2.9, fixed assets 2.8,
      payroll 2.10, group accounting 2.14) takes effect when that module is delivered, and the
      sub-section is not split for it. SRC-001 itself makes such behaviour absent while the module
      is off: "A module switched off is absent: it appears on no screen, menu, report or search result
      for that entity, rather than appearing greyed out, and none of its postings arise." (SRC-001 p.13,
      S1-2.1.7-c09). For stock-dependent entries SRC-001 says so directly: they "arise only where the
      inventory module is active" (SRC-001 p.17, S1-2.1.7-c77).
    examples: >-
      Delivery-note and stock rows of the receivables entry table (2.3.12), the inventory, fixed asset
      and payroll rows of the sub-ledger agreement (2.12.1), the payroll and import rows of tax capture
      (2.7.3), intercompany journals and transfers (2.2.5, 2.6.2).
  - key: reports-and-dashboards
    rule: >-
      Report and dashboard sub-sections are not split: a report or tile whose data comes from a later
      area appears when that area is delivered, under the same rule.
  - key: splits
    rule: >-
      A sub-section is split only where it holds a capability that does not depend on another module
      but is proposed for a different release, or where an acceptance test belongs to a later area.
  - key: section-intros
    rule: >-
      The introductory clauses of each level-2 section follow the mark of that module's release-1
      sub-sections, or its later release if it has none; see section_intros.
  - key: module-dependent-limits
    rule: >-
      Rule module-dependent-clauses covers postings that do not arise while the other module is off.
      It does not cover a release-1 transaction that arises anyway and needs data or accounts that
      belong to a later area (REV-01M5EP1W4DYPM707EB79AYEYV1, section 2). Such dependencies are
      handled by splitting the later sub-section (2.9.1, 2.10.1) or by decision D-INT-1 (postings to
      payroll, fixed asset and tax control accounts).
  - key: design-constraints
    rule: >-
      A part marked release-1 with constraint data-model is delivered in release 1 as a property of the
      data model and the storage, search and sort behaviour, so that a later release adds the
      user-visible feature without rework or data migration (S1-2.1.7-c08, "without data migration").
      Its acceptance in release 1 is limited to what release 1 data exercises.

assumptions:
  - id: A-01
    statement: >-
      Tiqri's first Sri Lanka entity is service-based under the business profile of 2.1.7 (no stock;
      S1-2.1.7-c69, c70). This drives inventory (2.9) to release 5 and two-way matching in payables
      (S1-2.5.6-c01).
    owner: product-owner
    if_wrong: Inventory (2.9) and the three-way match move into release 1 or 2.
  - id: A-02
    statement: >-
      Release 1 users work in English, with Sri Lanka date, number and currency formats. SRC-001
      lists English among the minimum languages (S1-2.1.8-c52). Whether Sinhala or Tamil documents
      are needed in release 1 is not recorded. Sinhala and Tamil are not in SRC-001's minimum
      language list (S1-2.1.8-c52 to c56, p.20), which adds languages "as configuration rather than
      as a customisation" (S1-2.1.8-c51). Customer and supplier names may still be held in a
      non-Latin script from release 1, which is why S1-2.1.8-c20 is a release-1 design constraint.
    owner: product-owner
    if_wrong: The language clauses of 2.1.8 move into release 1, and the tech lead confirms that Sinhala and Tamil are supported under S1-2.1.8-c51.
  - id: A-03
    statement: >-
      Release 1 runs one Sri Lanka entity in production; the platform holds entity as a mandatory
      attribute from the start (S1-2.14.2-c14, S1-2.2.3-c01), and the second entity (Norway, Q-003)
      arrives with group accounting in release 3.
    owner: product-owner
    if_wrong: If a second entity must go live with release 1, group accounting (2.14) and intercompany move into release 1.

releases:
  - release: 1
    name: Sri Lanka core books
    scope: >-
      Platform services, general ledger, receivables, tax and non-tax invoicing, payables, bank and
      cash with the posting rules engine, tax register and returns, supporting documents, balance
      sheet reconciliation and close, the standard report library, non-functional requirements and
      the acceptance protocol, for one service-based Sri Lanka entity in LKR with other currencies.
  - release: 2
    name: Complete Sri Lanka books
    scope: >-
      Under option A of D-INT-1: payroll for Sri Lanka (2.10 except its assistant and the release-1
      part of the employee master), fixed assets (core of 2.8), supplier invoice capture by email and
      optical reading (2.5.3, part of 2.11.2), and the report builder (2.13.2, 2.13.4). Under option
      B, payroll and the fixed asset core are in release 1 instead; under option C, the fixed asset
      core is in release 1 and payroll stays here (see variants). Corporate income tax (2.7.6) is
      proposed here, subject to the tax specialist's decision (D-2.7.6). Whatever option is chosen,
      this release ends the interim route that D-INT-1 settles for the modules it delivers.
    loading_task: >-
      An entity that has run on release 1 and activates payroll or fixed assets in release 2 needs
      their opening data loaded: the "fixed asset register with accumulated depreciation" and the
      "employee master with year-to-date payroll figures" (SRC-001 p.120, S1-2.16.2-c01). SRC-001
      promises that a further module is activated "without data migration" (S1-2.1.7-c08, p.13), so
      this load is a conversion inside TIQACC from the interim records that D-INT-1 settles, or a load
      from the external payroll system under option C. It is recorded here as a release-2 task
      whatever Q-006 decides; its method is for the qualified accountant (see risk R-06).
    order_reason: >-
      SRC-001 says the system posts payroll and depreciation itself (S1-0-c10; S1-2.8.3-c01) and that
      "No user journal is acceptable as a substitute" (SRC-001 p.8, S1-2-c02), so whatever interim
      route D-INT-1 allows should be as short-lived as possible.
  - release: 3
    name: Second country and group
    scope: >-
      Group structure, intercompany, eliminations, translation and consolidation (2.14 except 2.14.2
      and the assistant), group tax view (2.7.10), multi-entity fixed assets (2.8.12), multi-language
      (most of 2.1.8), and intercompany billing.
    order_reason: >-
      The first customer operates in Sri Lanka and other countries such as Norway (Q-003); a second
      entity needs consolidation (S1-2.1.7-c45, "Activated where the group has more than one
      entity") and a second language and country configuration.
  - release: 4
    name: Management depth
    scope: >-
      The CFO and executive dashboard (2.15), assistants (2.1.9 and each module's assistant), report
      creation by written instruction (2.13.3), treasury (2.6.7), cash flow forecasting (2.6.8),
      physical verification and capital budgeting of assets (2.8.10, 2.8.11), and mobile access
      (2.1.1 c03, 2.11.2 c03).
    order_reason: >-
      These read data the earlier releases create; for example the cash flow forecast draws on the
      receivables, payables, payroll, tax and capital modules (S1-2.6.8-c01 and following rows), and
      each dashboard tile "is a report definition under 2.13.2" (S1-2.15.1-c05). The product owner
      may choose to swap releases 3 and 4.
  - release: 5
    name: Other tenant profiles and breadth
    scope: >-
      Inventory and manufacturing (2.9, except the release-1 part of the item master 2.9.1), asset
      maintenance (2.8.9), standalone module deployment and
      industry templates (part of 2.1.7), and integration with other external systems and master
      data synchronisation (part of 2.1.6).
    order_reason: >-
      These serve tenants unlike the first customer: inventory "is activated only for entities whose
      business profile in 2.1.7 is inventory-based or mixed" (SRC-001 p.83, S1-2.9-c01; assumption
      A-01), and standalone deployment serves "an organisation that runs the rest of its finance
      function elsewhere" (SRC-001 p.13, S1-2.1.7-c12).

release_1_rationale: >-
  Release 1 is proposed as the smallest set on which Tiqri's internal finance team can run its books
  end to end in Sri Lanka: record every sale, purchase, receipt, payment and bank line once, have the
  system post them (BO-01), file Sri Lanka tax returns from the ledger (BO-04), reconcile every
  balance and close each period under control (BO-03), and produce statutory statements with
  drill-down to evidence (BO-02). The general ledger is "Always active — the base of every
  deployment" (S1-2.1.7-c32). The posting rules engine is in release 1 because it "is the one the
  whole system posts through, not a bank-only facility" (SRC-001 p.58, S1-2.6-c01; S1-2.2.4-c15).
  Platform services (roles, audit log, numbering, localisation, integration framework) are in release
  1 because every module uses them; SRC-001 describes them as "part of the platform, not of any one
  module" (SRC-001 p.14, S1-2.1.7-c25). That clause is cited only for this description: its own
  requirement concerns standalone module deployment and is marked for release 5. Balance sheet
  reconciliation is in release 1 because a period "cannot be hard-closed until every in-scope
  reconciliation is approved" (S1-2.12.3-c06). Receivables, invoicing and payables are in release 1
  because a service entity's chain "runs quotation, order, invoice, receipt" (S1-2.3.2-c08) and
  payables posts the supplier side; tax is in release 1 because the Sri Lanka entity has filing
  obligations from its first period, which the tax specialist confirms (Q-003, Q-021). Whether
  payroll and fixed assets are in release 1 is decision D-INT-1, which has no answer yet. SRC-001
  gives postings of a module that is not yet delivered no route that is free of conflict: "No user
  journal is acceptable as a substitute" (S1-2-c02), and control accounts for "Receivables,
  payables, inventory, payroll, fixed asset, tax and bank ... accept sub-ledger postings only;
  manual journals to them are blocked" (SRC-001 p.23, S1-2.2.1-c06), a release-1 clause. D-INT-1
  sets out options A, B and C and their effects; the variants block gives the marks under each.
  SRC-001 already leaves "[Service management, native CRM, e-commerce storefront]" out of phase 1
  (SRC-001 p.6, S1-1-c12; bracketed, workbook), and they are not specified in section 2. Each module
  is accepted separately (S1-2.16.4-c01), which allows this order.

