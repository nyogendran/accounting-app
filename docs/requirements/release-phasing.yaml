      The deliverables (S1-2.16.3-c01 to c04) are addressed to a vendor; how they apply to Tiqri's own
      product is Q-023.
    recommendation: Release 1 for the user manual and training of the modules in release 1 (S1-2.16.3-c02, c04).
    blocking_questions: [Q-023]
  - section: "2.16.4"
    heading: Acceptance protocol
    mark: release-1
    reason: >-
      "Each module is accepted separately" (S1-2.16.4-c01), which makes phasing possible; final
      acceptance needs "one full accounting cycle run in parallel" (S1-2.16.4-c04), which needs a
      current system to compare with (Q-006).
    blocking_questions: [Q-001, Q-006, Q-024]

