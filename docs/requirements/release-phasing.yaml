  # ================================================================ 2.9 Inventory management
  - section: "2.9.1"
    heading: Item master
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.9.1-c02, S1-2.9.1-c03, S1-2.9.1-c10, S1-2.9.1-c13, S1-2.9.1-c14, S1-2.9.1-c20, S1-2.9.1-c24, S1-2.9.1-c25, S1-2.9.1-c26]
        reason: >-
          Release-1 invoicing needs part of the item master. The tax determination matrix (2.4.2,
          release 1) works from the "Item tax class" (S1-2.4.2-c01, c04, pp.45-46), which is held on
          the item: "Tax class Yes Standard, zero, exempt; drives 2.4" (SRC-001 p.84,
          S1-2.9.1-c20). A service entity keeps its items "as non-stock service items on the item
          master, for pricing and description only" (p.16, S1-2.1.7-c70), and a "Service item No
          quantity; used on sales and purchase documents alike" (S1-2.9.1-c03). So the non-inventory
          and service item types (c02, c03), code and description (c10), category (c13), base unit
          (c14), tax class (c20), the group-wide master (c24), blocking (c25) and bulk maintenance
          (c26) are in release 1.
      - mark: later
        release: 5
        clauses: [S1-2.9.1-c01, S1-2.9.1-c04, S1-2.9.1-c05, S1-2.9.1-c06, S1-2.9.1-c07, S1-2.9.1-c09, S1-2.9.1-c11, S1-2.9.1-c12, S1-2.9.1-c15, S1-2.9.1-c16, S1-2.9.1-c17, S1-2.9.1-c18, S1-2.9.1-c19, S1-2.9.1-c21, S1-2.9.1-c22, S1-2.9.1-c23]
        reason: >-
          Stocked item types and stock attributes serve inventory, which "is activated only for
          entities whose business profile in 2.1.7 is inventory-based or mixed" (S1-2.9-c01);
          assumption A-01. The project-specific item type (c09) is proposed with inventory.
      - mark: later
        release: 2
        clauses: [S1-2.9.1-c08]
        reason: >-
          "Fixed asset item | Capitalised on receipt and passed to the asset register under 2.8.2,
          never to cost of sales" (SRC-001 p.84, S1-2.9.1-c08) is the item-master side of the row
          "Purchase order and goods receipt | Receipt of an asset item creates the asset record at
          receipt, per 2.9.1" (SRC-001 p.76, S1-2.8.2-c02). The two refer to each other, so c08 is
          placed with 2.8.2 in every option: release 2 under option A, release 1 under options B and
          C (see variants). Capital-item orders are release 1 ("Any value, capital items ...
          Requisition and purchase order", SRC-001 p.51, S1-2.5.5-c04); under option A how a capital
          item received in release 1 reaches the ledger is within decision D-INT-1 (fixed asset
          events, S1-2.8.13-c01 to c12).
