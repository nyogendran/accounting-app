subsections:
  # ================================================================ 2.1 Platform, access and security
  - section: "2.1.1"
    heading: Deployment and access
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.1.1-c01, S1-2.1.1-c02, S1-2.1.1-c04, S1-2.1.1-c05]
        reason: >-
          Browser access, three environments, fail-safe behaviour and session timeout are needed by
          every module from the first day (S1-2.1.1-c01, c02, c04, c05); the tenancy model is Q-001.
      - mark: later
        release: 4
        clauses: [S1-2.1.1-c03]
        reason: >-
          Mobile approval, photo capture and dashboard viewing (S1-2.1.1-c03) add convenience but no
          book-keeping step; grouped with the other mobile features.
    blocking_questions: [Q-001]
  - section: "2.1.2"
    heading: User roles and segregation of duties
    mark: release-1
    reason: >-
      Platform service every module needs (described as "part of the platform", S1-2.1.7-c25; see
      release_1_rationale); "a user cannot approve a document they raised" (S1-2.1.2-c16) underpins
      every posting, and the small-team release (S1-2.1.2-c17) fits the first customer's team.
    blocking_questions: [Q-009]
  - section: "2.1.3"
    heading: Security controls
    mark: release-1
    reason: >-
      Single sign-on with MFA, encryption, residency and leaver disabling (S1-2.1.3-c01 to c05) are
      the baseline for holding financial data in a cloud service (BO-08). The identity provider,
      encryption standard and hosting locations are security-owner decisions for the build, not for
      this phasing. How tenants are separated is a further open item (OI-TENANT in
      docs/requirements/actors.yaml; question record Q-031).
    blocking_questions: [Q-023, Q-028]
  - section: "2.1.4"
    heading: Audit log
    mark: release-1
    reason: Platform service (described as "part of the platform", S1-2.1.7-c25; see release_1_rationale); the uneditable log (S1-2.1.4-c01) is the basis of BO-02, BO-03 and BO-08.
    blocking_questions: [Q-020, Q-025]
  - section: "2.1.5"
    heading: Search and enquiry
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.1.5-c01, S1-2.1.5-c02, S1-2.1.5-c03, S1-2.1.5-c04, S1-2.1.5-c05, S1-2.1.5-c06, S1-2.1.5-c07, S1-2.1.5-c08, S1-2.1.5-c09, S1-2.1.5-c10, S1-2.1.5-c11, S1-2.1.5-c12, S1-2.1.5-c13, S1-2.1.5-c14, S1-2.1.5-c15, S1-2.1.5-c16]
        reason: >-
          Finding any record from any detail on every screen (S1-2.1.5-c01) is daily value to the
          finance team, and search must respect permissions from the start (S1-2.1.5-c13). Search of
          "the text inside the document, so an invoice can be found from a number printed on the
          scan" (SRC-001 p.10, S1-2.1.5-c08) and "Full-text search across attachments"
          (S1-2.11.4-c02) need text recognition on scanned images in release 1; see 2.11.2.
      - mark: needs-decision
        owner: product-owner
        clauses: [S1-2.1.5-c17]
        reason: >-
          "Acceptance: a user finds a two-year-old supplier invoice from the invoice number printed on
          the scan alone" (SRC-001 p.11, S1-2.1.5-c17). At release-1 acceptance the system holds a
          two-year-old invoice only if history is migrated (Q-006, D-2.16.2); otherwise the test
          cannot run as written at go-live.
        recommendation: >-
          Release 1 if D-2.16.2 migrates at least two years of history. Otherwise the product owner
          decides, under the acceptance protocol (S1-2.16.4-c01), how this test is run for release-1
          acceptance or when it is run later.
    blocking_questions: [Q-006, Q-024]
  - section: "2.1.6"
    heading: External system integration and connectivity
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.1.6-c01, S1-2.1.6-c02, S1-2.1.6-c04, S1-2.1.6-c06, S1-2.1.6-c08, S1-2.1.6-c11, S1-2.1.6-c12, S1-2.1.6-c14, S1-2.1.6-c15, S1-2.1.6-c16, S1-2.1.6-c17, S1-2.1.6-c27, S1-2.1.6-c28, S1-2.1.6-c29, S1-2.1.6-c30, S1-2.1.6-c31, S1-2.1.6-c32, S1-2.1.6-c33, S1-2.1.6-c34, S1-2.1.6-c35, S1-2.1.6-c36, S1-2.1.6-c37, S1-2.1.6-c38, S1-2.1.6-c39, S1-2.1.6-c40]
        reason: >-
          S1-2.1.6-c17 lists four go-live integrations, all bracketed: "[bank statement feed], [POS or
          e-commerce], [attendance device, where used], [tax authority e-filing portal where
          applicable]" (SRC-001 p.11; workbook values 17 to 20, to be confirmed). This proposal
          assumes the bank statement feed and the tax e-filing portal for release 1. It leaves out
          POS or e-commerce, because the first entity is assumed service-based (A-01) and SRC-001's
          bracketed out-of-scope list for phase 1 names an "e-commerce storefront" (S1-1-c12); and
          the attendance device, because attendance belongs to payroll (S1-2.10.4-c01). The product
          owner confirms values 17
          to 19 and the tax specialist value 20. Bulk journal upload and API journals use this
          framework (S1-2.2.4-c03); the interface controls apply to every interface (S1-2.1.6-c27 to
          c35). c08 introduces the table of systems; of its rows in release 1, c11 and c12, only
          banking and the tax authority portals are needed in release 1, and the other systems in
          those rows follow in release 5. Under option C of D-INT-1 the row that names "Payroll and
          workforce management" (S1-2.1.6-c09) also moves into release 1, because payroll results are
          then fed through this interface (S1-2.1.6-c14); see variants.
      - mark: later
        release: 5
        clauses: [S1-2.1.6-c03, S1-2.1.6-c05, S1-2.1.6-c07, S1-2.1.6-c09, S1-2.1.6-c10, S1-2.1.6-c13, S1-2.1.6-c18, S1-2.1.6-c19, S1-2.1.6-c20, S1-2.1.6-c21, S1-2.1.6-c22, S1-2.1.6-c23, S1-2.1.6-c24, S1-2.1.6-c25, S1-2.1.6-c26, S1-2.1.6-c41]
        reason: >-
          Web services, a database read interface, event-driven synchronisation, integration with
          procurement, CRM, POS, ERP and other systems, and master data synchronisation serve tenants
          that keep those systems; SRC-001's own acceptance test uses an external billing system
          (S1-2.1.6-c41). Release 1 integration controls are accepted through the bank feed and bulk
          upload tests (S1-2.6.17-c03, S1-2.2.4-c32).
    blocking_questions: [Q-022]
  - section: "2.1.7"
    heading: Modular architecture, industry configuration and activation
    mark: split
    parts:
      - mark: release-1
        clauses: [S1-2.1.7-c01, S1-2.1.7-c02, S1-2.1.7-c03, S1-2.1.7-c04, S1-2.1.7-c05, S1-2.1.7-c06, S1-2.1.7-c07, S1-2.1.7-c08, S1-2.1.7-c09, S1-2.1.7-c10, S1-2.1.7-c11, S1-2.1.7-c31, S1-2.1.7-c32, S1-2.1.7-c33, S1-2.1.7-c34, S1-2.1.7-c35, S1-2.1.7-c36, S1-2.1.7-c37, S1-2.1.7-c38, S1-2.1.7-c39, S1-2.1.7-c40, S1-2.1.7-c41, S1-2.1.7-c42, S1-2.1.7-c43, S1-2.1.7-c44, S1-2.1.7-c45, S1-2.1.7-c46, S1-2.1.7-c47, S1-2.1.7-c48, S1-2.1.7-c49, S1-2.1.7-c50, S1-2.1.7-c51, S1-2.1.7-c52, S1-2.1.7-c53, S1-2.1.7-c54, S1-2.1.7-c57, S1-2.1.7-c59, S1-2.1.7-c60, S1-2.1.7-c61, S1-2.1.7-c62, S1-2.1.7-c63, S1-2.1.7-c64, S1-2.1.7-c65, S1-2.1.7-c66, S1-2.1.7-c67, S1-2.1.7-c68, S1-2.1.7-c69, S1-2.1.7-c70, S1-2.1.7-c71, S1-2.1.7-c72, S1-2.1.7-c73, S1-2.1.7-c74, S1-2.1.7-c75, S1-2.1.7-c76, S1-2.1.7-c77, S1-2.1.7-c78, S1-2.1.7-c79, S1-2.1.7-c80, S1-2.1.7-c81, S1-2.1.7-c82]
        reason: >-
          Per-entity activation is what lets modules arrive release by release without disruption
          (S1-2.1.7-c08, c79); the business profile decides which document stages and postings exist
          for a service entity (S1-2.1.7-c69 to c77), which receivables and payables depend on
          (S1-2.3.2-c08, S1-2.5.6-c01); configuration without development is BO-07 (S1-2.1.7-c53, c54).
          "An entity's industry selection also proposes its likely tax obligations, as set out in
          2.7.2" (SRC-001 p.16, S1-2.1.7-c57) is the same behaviour as S1-2.7.2-c02, which is in
          release 1, so it is marked with it; the industry templates themselves (c55, c56, c58) stay
          in release 5.
      - mark: later
        release: 5
        clauses: [S1-2.1.7-c12, S1-2.1.7-c13, S1-2.1.7-c14, S1-2.1.7-c15, S1-2.1.7-c16, S1-2.1.7-c17, S1-2.1.7-c18, S1-2.1.7-c19, S1-2.1.7-c20, S1-2.1.7-c21, S1-2.1.7-c22, S1-2.1.7-c23, S1-2.1.7-c24, S1-2.1.7-c25, S1-2.1.7-c26, S1-2.1.7-c27, S1-2.1.7-c28, S1-2.1.7-c29, S1-2.1.7-c30, S1-2.1.7-c55, S1-2.1.7-c56, S1-2.1.7-c58]
        reason: >-
          Standalone module deployment (S1-2.1.7-c12 to c30) serves organisations that run the rest of
          their finance elsewhere, and industry templates (c55, c56, c58) serve other sectors; the
          first customer runs the integrated set (Q-001).
      - mark: needs-decision
        owner: product-owner
        clauses: [S1-2.1.7-c84]
        reason: >-
          The acceptance clause S1-2.1.7-c84 (SRC-001 p.17) joins several tests. Two of its parts test
          release-1 clauses on which rule module-dependent-clauses relies: "an entity configured for
          services alone completes quotation to receipt with no inventory screen, report or posting
          anywhere in the flow" and "a user licensed for some modules cannot reach the others through
          any screen, report, search or API call" (S1-2.1.7-c07, c09). A third part, "activating a
          second module later leaves the first unchanged and requires no migration" (SRC-001 p.17),
          follows the standalone-module test in the clause but is exercised in release 2 under
          options A and C, when payroll or fixed assets are activated for an entity already running
          release 1 (none under option B, where both are in release 1). The release-2 loading task
          stands against "requires no migration" (releases, loading_task; risk R-06). The other parts
          test standalone deployment, later activation of inventory, two entities with different
          module sets, and industry templates, which are in releases 3 and 5.
        recommendation: >-
          Partial acceptance: run the two parts quoted first at release-1 acceptance; run the part
          "activating a second module later leaves the first unchanged and requires no migration" at
          release-2 acceptance when payroll or fixed assets are activated (options A and C), once the
          product owner, with the qualified accountant, has settled how it stands with the release-2
          loading task (R-06); and run the clause in full in release 5. The product owner decides
          whether partial acceptance of one clause is allowed under the acceptance protocol
          (S1-2.16.4-c01).
      - mark: needs-decision
        owner: product-owner
        clauses: [S1-2.1.7-c83]
        reason: >-
          "Vendors state in Annexure A which modules are available today" (S1-2.1.7-c83) has no
          meaning for Tiqri's own product until Q-023 is decided.
        recommendation: Decide under Q-023; no build effect expected.
