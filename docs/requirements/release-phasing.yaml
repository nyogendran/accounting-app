    parts:
      - mark: release-1
        clauses: [S1-2.10.1-c01, S1-2.10.1-c02, S1-2.10.1-c07, S1-2.10.1-c09]
        reason: >-
          Expense claims are release-1 payables documents raised "by an employee" (S1-2.5.2-c07) and
          post "Cr Employee payable" (S1-2.5.13-c13), so release 1 needs a minimal employee record:
          employee number (c01), entity (c02), department, cost centre and project for the expense
          dimensions (c07), and bank details for settlement "by payment" (c09), whose change "requires
          maker–checker" (SRC-001 p.91). It is the same record payroll uses later, since "On
          activation, a module reads the master data ... already present rather than requiring its
          own copy" (p.17, S1-2.1.7-c80). SRC-001 marks the fields deferred to release 2 as
          mandatory ("Yes": S1-2.10.1-c03 to c06, c08, c10, c11, p.91). This split proposes that
          their mandatory validation applies from the activation of payroll for the entity, so that
          a release-1 record holding only c01, c02, c07 and c09 is valid; on activation the existing
          records are completed, which is part of the release-2 loading task (releases,
          loading_task). The release-1 part holds no reporting line (S1-2.10.11-c08) and no
          self-service route (S1-2.10.11-c04); see 2.5.2. Alternative for the product owner: defer
          expense claims with the rest of 2.10.1. All of this is decision D-2.10.1.
      - mark: later
        release: 2
        clauses: [S1-2.10.1-c03, S1-2.10.1-c04, S1-2.10.1-c05, S1-2.10.1-c06, S1-2.10.1-c08, S1-2.10.1-c10, S1-2.10.1-c11, S1-2.10.1-c12, S1-2.10.1-c13]
        reason: >-
          Marked as under option A of D-INT-1 (release 1 under option B; release 2 under C). The
          remaining fields drive payroll: entitlement, pay structure, pay basis, tax residency,
          statutory schemes and pro-rating (S1-2.10.1-c03 to c06, c08, c10, c11, c13). Payroll's Sri
          Lanka rule set is configuration (S1-2.10.2-c01) needing statutory content from the tax
          specialist. SRC-001 rejects a third-party product "synchronising by file transfer"
          (S1-2.10-c01; Q-022), which bears on option C.
    blocking_questions: [Q-022, Q-029]
