rules: >-
  Coverage: the overview headed "i TIQACC system overview" (pp.4-5), indexed as section 0 because the
  clause ID pattern needs digits; section 1; the text of section 2 before 2.1 (section "2"); every
  numbered section and sub-section from 2.1 to 2.16.4, including the text a level-2 section carries
  before its first sub-section; and section 3. Left out: the cover page (p.1), the table of contents
  (pp.2-3), headings, table header rows, the "Page N of 121" markers and the "===== PAGE N ====="
  separators. Sections 2.1, 2.2 and 2.16 carry no text of their own, so all their clauses sit in their
  sub-sections. One clause is one of these: paragraph, one block of running text with its wrapped
  lines, including a paragraph that opens with a run-in heading such as "Creating a schedule.", and a
  full-sentence caption or note printed with a figure; numbered, one numbered item with its wrapped
  lines; table-row, one body row of a table with all its wrapped lines (the extraction interleaves the
  wrapped cells of a row, and a row ends where the next row's first cell starts), and for a grid whose
  cells are independent items (reports, languages, systems, categories, checks) one printed row; entry,
  one row of an accounting-entry table, meaning a table whose posting column is headed "Entry the
  system auto-posts", plus the intercompany entry table in 2.14.4; acceptance, one "Acceptance:"
  statement, or one numbered test under an "Acceptance tests" sub-section; other, a figure, diagram or
  illustration (one clause for all its labels, because the extraction flattens it and the PDF is
  authoritative), a band or label printed inside a figure, and the signature and annexure lines of
  section 3. Fields: section and heading name the numbered section or sub-section; subheading is the
  nearest unnumbered sub-heading above the clause within that section, or null. Numbered items restart
  under each sub-heading, so a citation names the section, the subheading and the item number. page is
  the page on which the clause starts (the number on the first "Page N of 121" marker after its first
  line); a clause that crosses a page break keeps its start page, and its line range then includes the
  marker and separator lines. lines are the first and last 1-based lines in the extraction. anchor is
  the first 6 to 12 whitespace-separated tokens of the clause, copied from the start of its first line
  (numbered items keep their number); where the first line has fewer than six tokens the anchor
  continues on the next line, joined by one space; where the whole clause has fewer than six tokens the
  anchor is the whole clause.
