missing_inputs:
  - {name: "Annexure A — vendor response matrix (every clause in Section 2 marked S, C, X or N)", cited_at: S1-3-c03, status: "Does not apply as written: TIQACC is Tiqri's own multi-tenant SaaS product (Q-001), so there is no vendor response. The clauses that ask a vendor to state, quote or answer something need an internal answer or a decision to drop them: S1-0-c32, S1-1-c12, S1-1-c13, S1-2.1.3-c03, S1-2.1.3-c04, S1-2.1.7-c11, S1-2.1.7-c29, S1-2.1.7-c31, S1-2.1.7-c83, S1-2.1.8-c57, S1-2.2.9-c39, S1-2.11.4-c07. Not vendor-addressed, but resting on the customer-and-vendor relationship and so also needing an internal answer: S1-2.16.1-c06 ('at no extra charge') and the handover deliverables S1-2.16.3-c01 to c04. Owner product-owner, with the tech-lead and security-owner for the platform and security items; open under Q-023. The owner of statutory data-residency rules (S1-2.1.3-c04) is open under Q-028."}
  - {name: "Annexure B — current chart of accounts, monthly transaction volumes by module, and existing tax invoice and non-tax invoice formats", cited_at: S1-3-c04, status: "Not in the repository; partly outstanding (Q-005, Q-006). Its three items follow."}
  - {name: "Annexure B item 1 — current chart of accounts", cited_at: S1-3-c04, status: "Needed only if data is migrated (Q-005, Q-006 open). Otherwise the chart is created in the system by Finance, per S1-2.2.1-c01 and the Q-005 answer so far."}
  - {name: "Annexure B item 2 — monthly transaction volumes by module, typical and peak", cited_at: S1-3-c04, status: "Requested from Finance (Q-005). Also needed for the volume values in S1-2.16.1-c01 and S1-2.16.1-c02 (workbook values 170 to 174) and the counts in S1-1-c09 and S1-1-c10 (values 4 to 8)."}
  - {name: "Annexure B item 3 — existing tax invoice and non-tax invoice formats (blank or redacted samples, per country)", cited_at: S1-3-c04, status: "Requested from Finance (Q-005). Bears on the mandatory content in S1-2.4.3-c02 to c15 and the prescribed wording in values 79 and 86 (Q-021)."}
  - {name: "Support SLA — severity-based response and resolution times and named escalation contacts", cited_at: S1-2.16.1-c05, status: "Referenced as 'stated in the SLA'; no SLA is in the repository. For Tiqri's own product (Q-001) this becomes Tiqri's service commitment to tenants. Owner product-owner, tech lead confirms feasibility; open under Q-024, with the service-level values 16, 96, 153, 169 and 175 to 177."}
  - {name: "The entity's own document retention policy", cited_at: S1-2.11.4-c05, status: "Referenced ('the longer of the entity's own policy and the statutory retention period of each jurisdiction'); not in the repository. For a multi-tenant product each tenant has its own; the statutory periods per country need the tax specialist (workbook values 15, 40, 147, 157, 160, 164, 168). Statutory periods per country: Q-020 (tax-specialist); default policy and one retention model: Q-025 (product-owner)."}
  - {name: "Statutory return forms, e-filing file formats and prescribed invoice wording per jurisdiction", cited_at: S1-2.7.1-c11, status: "Referenced in S1-2.7.1-c11 ('The statutory form the return maps to, and the electronic file format for the filing portal'), S1-2.4.7-c04, S1-2.7.4-c07 and S1-2.4.3-c09; none in the repository. Depends on the countries in Q-003. Owner tax-specialist; open under Q-021. Each country's content is needed before that country's tax acceptance (S1-2.4.4-c03)."}
  - {name: "Chart-of-accounts naming standard", cited_at: S1-2.2.1-c05, status: "Referenced in S1-2.2.1-c05 ('Follows the naming standard in 2.2.2') and S1-2.2.2-c08 ('Unique; follows the naming standard'); 2.2.2 contains no standard and none is in the repository. Owner qualified-accountant; open under Q-014."}
  - {name: "Applicable accounting framework per entity and for the group", cited_at: S1-2.2.9-c28, status: "Referenced as 'the applicable accounting standard' (S1-2.2.9-c28) and in the IFRS or GAAP adjustment of S1-2.14.7-c07; open under Q-003 (owner qualified-accountant)."}
