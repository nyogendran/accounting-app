method: >-
  Every "[" and "]" in the extraction was found with a text search and each match was read in context.
  The extraction holds 181 bracket pairs, which confirms the orchestrator's count. Three pairs break
  across a line (lines 485-486, 1950-1951 and 1979-1980); the token is written here joined with one
  space and line is the line where the bracket opens. Leaving out the three signature names on line
  5077 ([Name, Finance Manager], [Name, Internal Audit], [Name, Managing Director]) leaves 178 values,
  listed below in document order: 181 - 3 = 178. 53 of them are [role], which matches the
  orchestrator's count; two more are [director], so 55 have kind role. Each value is tied to the clause
  that contains it in the clause index. spec_value copies the bracket's own content only where it is a
  concrete value or a concrete format pattern (for example "30", "1 October", "CC-nn", "nnnnnn");
  placeholders such as [No.], [n], [x], [X], [Y], [role], [director], [amount], [amount 1],
  [Currency X], [location] and [A], and descriptive placeholders such as [identity provider], are
  null. No value is proposed here. Values 1 to 3 are examples inside the convention that explains
  brackets (S1-1-c03) and need no confirmation; values inside illustrations and worked examples are
  marked as such in needed_for. owner follows the brief's mapping: accounting treatment to
  qualified-accountant, tax and statutory to tax-specialist, security to security-owner, platform to
  tech-lead, and scope, limits, workflow and business roles to product-owner; where the owner was
  unclear it is product-owner and needed_for says why. Version 2 applies three owner rules decided by
  the orchestrator after review REV-01M5DADKQY1VNR1FMN2414KZ58: code structure (values 25, 26 and
  32 to 37) to qualified-accountant, as in Q-005; control thresholds (values 31, 56, 159 and 162) to
  qualified-accountant, as accounting-risk acceptance in the authority matrix; service-level targets
  (values 16, 96, 153, 169 and 175 to 177) to product-owner, with the tech lead confirming feasibility
  (Q-024). Version 3 changes only the needed_for text of value 4, which no longer says "per tenant"
  and links Q-031 (REV-01M5EQY9R7BC1SY2XDY6S9YA52). Where a value depends on a question record,
  needed_for names it. TIQACC is Tiqri's own
  multi-tenant product (Q-001), so many of these values may become tenant settings with a default;
  deciding that for each value is for its owner, not for this workbook.
