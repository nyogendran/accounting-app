method: "Build a clause crosswalk from SRC-001 (S1) to SRC-007 (S7) from the two clause indexes. Read-only\
  \ on\nsources; writes one YAML file given as the first argument.\n\nText of a clause = its line range\
  \ in the extraction, page markers and separators removed, whitespace\nnormalised. Matching, in order:\n\
  \  0. successor: the reviewed pairs in docs/requirements/crosswalk-successors.yaml, for clauses that\n\
  \     were rewritten or split beyond what text similarity finds; one row per S7 clause, with the reason;\n\
  \  1. same: identical text once list numbering, punctuation and case are ignored, one-to-one,\n    \
  \ preferring the same section and the nearest position (the clause ID may still differ);\n  2. changed:\
  \ for each remaining S1 clause, the best remaining S7 clause by difflib ratio, searched in\n     the\
  \ same section first and then everywhere; accepted when the ratio is at least 0.6;\n  3. removed: S1\
  \ clauses left unmatched; new: S7 clauses left unmatched.\nThe 2.4.3 box clauses share line ranges,\
  \ so their text is the anchor only (stated in the output).\n\nUsage: python tools/sources/crosswalk_clauses.py\
  \ <output.yaml>"
