rules: >-
  These are the rules of the SRC-001 index (docs/requirements/clause-index.yaml, version 2) applied to
  SRC-007 (V2.2, 137 pages). Each deviation from them is stated below with its reason.
  Coverage: the overview headed "i TIQACC system overview" (pp.4-5), indexed as section 0 because the
  clause ID pattern needs digits; section 1; the text of section 2 before 2.1 (section "2"); every
  numbered section and sub-section from 2.1 to 2.16.5, including the text a level-2 section carries
  before its first sub-section; and section 3 (p.137). Left out: the cover page (p.1), the table of
  contents (pp.2-3), headings, table header rows, the "Page N of 137" markers, the "===== PAGE N ====="
  separators, and the four extractor header lines at lines 1 to 4 (SOURCE, SOURCE_SHA256, EXTRACTOR,
  PAGES). Deviation: the extractor header lines are new in this extraction and are not document text.
  Sections 2.1, 2.2 and 2.16 carry no text of their own, so all their clauses sit in their
  sub-sections. Sub-section 2.16.5 is new in SRC-007 and is covered like any other. One clause is one
  of these: paragraph, one block of running text with its wrapped lines, including a paragraph that
  opens with a run-in heading such as "Creating a schedule." or "Worked example.", and a full-sentence
  caption or note printed with a figure or a worked table; numbered, one numbered item with its
  wrapped lines; table-row, one body row of a table with all its wrapped lines (the extraction
  interleaves the wrapped cells of a row, and a row ends where the next row's first cell starts), and
  for a grid whose cells are independent items (reports, languages, systems, categories, checks,
  configuration areas) one printed row; entry, one row of an accounting-entry table, meaning a table
  whose posting column is headed "Entry the system auto-posts", plus the intercompany entry table in
  2.14.4; acceptance, one "Acceptance:" statement, or one numbered test under an "Acceptance tests"
  sub-section; other, a figure, diagram or illustration (one clause for all its labels, because the
  extraction flattens it and the PDF is authoritative), a band or label printed inside a figure, and
  the signature and annexure lines of section 3. Kind other is not a statement that a clause is
  non-normative: other clauses can state obligations, and are read as requirements like any other
  kind. Worked tables of illustrative figures (2.2.4 p.36, 2.8.3 p.91) are indexed one table-row per
  printed data row, as SRC-001 did for its 2.8.3 worked example. Two-column and interleaved layouts,
  each stated as a deviation with the reading applied. (a) The mandatory-content list in 2.4.3 (p.55)
  is two boxes printed side by side, "Tax invoice — generated by the system" (8 bulleted items) and
  "Non-tax invoice — generated by the system" (6 bulleted items), whose items are not row-aligned;
  each item is one table-row clause (S7-2.4.3-c02 to c09 the tax-invoice items, S7-2.4.3-c10 to c15
  the non-tax items, each in the box's order), the box heading is its subheading, and because the
  extraction interleaves the two columns, line ranges of the two boxes overlap and an anchor is a run
  of the item's opening words that stands unbroken on one line of its range, not necessarily at the
  start of that line. Extraction lines 2348 to 2361 are word for word the same as SRC-001 lines 1967
  to 1980, so the item split follows the orchestrator's reading of SRC-001 PDF p.46; PDF p.55 itself
  was not rendered for this index (no PDF renderer was available to the indexing agent) and needs a
  person's check against the printed page. (b) Two-column tables whose rows are aligned in the
  extraction, one printed row per line or wrapped pair of lines, are indexed one table-row per printed
  row under the grid rule: 2.10.11 Employee and Manager (p.109), 2.14.2 "Held at group level, shared"
  and "Held per entity, separate" (p.121) and 2.15.4 Receivables and Payables (p.128), as SRC-001 did
  for the same tables; the reading is from the extraction, not the rendered PDF. (c) Three-column
  tables whose cells wrap and interleave, such as 2.2.2 "How far the check reaches" (p.29) and 2.1.7
  "Standalone module deployment" (pp.13-14), follow the general table-row rule. (d) Figures with
  side-by-side panels are each one other clause, for example 2.1.8 p.18, 2.2.6 p.37, 2.2.8 p.41,
  2.6.3 p.73, 2.9.12 p.101, 2.12.4 p.115, 2.13 p.115, 2.14 p.119, 2.15 p.127 and 2.15.10 p.132. Fields: section and
  heading name the numbered section or sub-section; subheading is the nearest unnumbered sub-heading
  above the clause within that section, or null. It is positional and is not a statement of scope: a
  clause can sit under a sub-heading that does not describe it. For example, the acceptance statement
  S7-2.2.2-c61 (p.31) tests journal-file mapping (2.2.4) and chart set-up (2.2.1) but is printed at
  the end of 2.2.2 under "Ongoing hygiene reports", and is indexed where it is printed. Run-in
  headings, such as "Creating a schedule." or "Worked example." opening a paragraph, count as
  sub-headings for the clauses that follow them; unnumbered labels printed above a table, such as
  "Journal header — repeated on every line of the journal" and "Journal line" in 2.2.4 (pp.34-35),
  count as sub-headings. Item numbers restart under each sub-heading and also after a table with no
  new sub-heading, so section, subheading and item number together are not unique (for example
  S7-2.6.5-c01 and c09, S7-2.7.6-c01 and c14): cite a clause by its clause ID. One exception to the
  positional subheading, carried over from SRC-001: the second numbered list in 2.6.6 (S7-2.6.6-c18 to
  c22) follows the "Manual intervention" list with no heading of its own (orchestrator's reading of
  SRC-001 PDF p.62; the extraction is unchanged at SRC-007 p.75) and is not part of that list, so its
  subheading is null. Text is indexed exactly as printed, including passages that look like editing
  errors in the source (S7-2.1.8-c36 "Customers 25,000" and S7-2.15.8-c22 "Legal entities 1 Numbering
  series"); the index does not correct the source. page is the page on which the clause starts (the
  number on the first "Page N of 137" marker after its first line); a clause that crosses a page break
  keeps its start page, and its line range then includes the marker and separator lines. lines are
  the first and last 1-based lines in the extraction. anchor is the first 6 to 12
  whitespace-separated tokens of the clause, copied from the start of its first line (numbered items
  keep their number); where the first line has fewer than six tokens the anchor continues on the next
  line, joined by one space; where the whole clause has fewer than six tokens the anchor is the whole
  clause. A straight double quote inside an anchor is written as \" in YAML; as in SRC-001, an anchor
  may stop before an opening quotation mark while still holding at least six tokens.
